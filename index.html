<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>freeeインポート用変換ツール（振替伝票形式・Web版）</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/encoding-japanese/2.1.0/encoding.min.js"></script>
    <style>
        body { font-family: 'Meiryo', sans-serif; background-color: #f4f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 500px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; font-size: 22px; }
        .drop-zone { border: 2px dashed #4CAF50; background-color: #e8f5e9; padding: 40px 20px; border-radius: 8px; cursor: pointer; color: #555; transition: 0.3s; line-height: 1.5; font-size: 15px;}
        .drop-zone.dragover { background-color: #c8e6c9; }
        .file-list { margin-top: 15px; text-align: left; max-height: 120px; overflow-y: auto; font-size: 0.9em; color: #666; }
        .btn { background-color: #4CAF50; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.2s;}
        .btn:hover { background-color: #45a049; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .status { margin-top: 10px; font-size: 0.9em; color: #e91e63; font-weight: bold; min-height: 20px;}
    </style>
</head>
<body>

<div class="container">
    <h2>freee変換ツール(振替伝票)</h2>
    
    <div id="drop-zone" class="drop-zone">
        ここに「明細データ」のCSV/TSVファイルを<br>ドラッグ＆ドロップしてください<br>またはクリックしてファイルを選択<br>（複数ファイル対応）
        <input type="file" id="file-input" multiple accept=".csv,.tsv" style="display: none;">
    </div>

    <div id="file-list" class="file-list"></div>
    <div id="status-msg" class="status"></div>

    <button id="execute-btn" class="btn" disabled>Excelに変換してダウンロード</button>
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const fileListDiv = document.getElementById('file-list');
    const executeBtn = document.getElementById('execute-btn');
    const statusMsg = document.getElementById('status-msg');
    let selectedFiles = [];

    const freeeColumns = [
        "日付", "伝票番号", "決算整理仕訳", 
        "借方勘定科目", "借方科目コード", "借方補助科目", "借方取引先", "借方取引先コード", 
        "借方部門", "借方品目", "借方メモタグ", "借方セグメント1", "借方セグメント2", "借方セグメント3", 
        "借方金額", "借方税区分", "借方税額", 
        "貸方勘定科目", "貸方科目コード", "貸方補助科目", "貸方取引先", "貸方取引先コード", 
        "貸方部門", "貸方品目", "貸方メモタグ", "貸方セグメント1", "貸方セグメント2", "貸方セグメント3", 
        "貸方金額", "貸方税区分", "貸方税額", "摘要"
    ];

    const csvPayCols = {
        'H.支払金額（現金）': '現金',
        'H.支払金額（クレジットカード）': 'クレジット',
        'H.支払金額（ポイント）': 'ポイント',
        'H.支払金額（電子マネー）': '電子マネー',
        'H.支払金額（商品券：釣り無）': '商品券無',
        'H.商品券差額': '商品券差額',
        'H.支払金額（商品券：釣り有）': '商品券有',
        'H.商品券現金釣銭': '商品券現金釣銭',
        'H.支払金額（その他）': '掛売'
    };

    const payProperties = {
        '現金': {'品目': '【成瀬】現金（USENレジ）', 'is_uncol': false},
        'クレジット': {'品目': '【成瀬】クレジット（USENレジ）', 'is_uncol': false},
        'ポイント': {'品目': '【成瀬】ポイント（USENレジ）', 'is_uncol': false},
        '電子マネー': {'品目': '【成瀬】電子マネー（USENレジ）', 'is_uncol': false},
        '商品券無': {'品目': '【成瀬】商品券（釣無し）（USENレジ）', 'is_uncol': false},
        '商品券差額': {'品目': '商品券差額', 'is_uncol': false},
        '商品券有': {'品目': '【成瀬】商品券（釣有り）（USENレジ）', 'is_uncol': false},
        '商品券現金釣銭': {'品目': '商品券現金釣銭', 'is_uncol': false},
        '掛売': {'品目': '【成瀬】掛売（USENレジ）', 'is_uncol': false},
        '未回収': {'品目': '【成瀬】掛売（USENレジ）', 'is_uncol': true} 
    };

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        addFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => addFiles(e.target.files));

    function addFiles(files) {
        for (let file of files) {
            const ext = file.name.split('.').pop().toLowerCase();
            if ((ext === 'csv' || ext === 'tsv') && !selectedFiles.some(f => f.name === file.name)) {
                selectedFiles.push(file);
            }
        }
        updateFileList();
    }

    function updateFileList() {
        fileListDiv.innerHTML = selectedFiles.map(f => `<div>📄 ${f.name}</div>`).join('');
        executeBtn.disabled = selectedFiles.length === 0;
        statusMsg.innerText = '';
    }

    function cleanValue(val) {
        if (val === undefined || val === null) return 0;
        let strVal = String(val).replace(/[￥\\,"]/g, '').trim();
        if (strVal === '-' || strVal === '') return 0;
        let num = Number(strVal);
        return isNaN(num) ? 0 : num;
    }

    // ★修正箇所：CSVの1行を正しく分割し、「空欄（""）」を正しく認識する関数
    function parseCSVLine(line, separator) {
        if (separator === '\t') {
            return line.split('\t').map(c => c.replace(/^"|"$/g, '').trim());
        } else {
            let result = [];
            let inQuotes = false;
            let currentCell = '';
            for (let i = 0; i < line.length; i++) {
                let char = line[i];
                if (inQuotes) {
                    if (char === '"') {
                        if (line[i + 1] === '"') {
                            currentCell += '"';
                            i++;
                        } else {
                            inQuotes = false;
                        }
                    } else {
                        currentCell += char;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                    } else if (char === ',') {
                        result.push(currentCell.trim());
                        currentCell = '';
                    } else {
                        currentCell += char;
                    }
                }
            }
            result.push(currentCell.trim());
            return result;
        }
    }

    executeBtn.addEventListener('click', async () => {
        executeBtn.disabled = true;
        statusMsg.innerText = "処理中...";
        statusMsg.style.color = "#4CAF50";

        for (let file of selectedFiles) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);
                const detected = Encoding.detect(uint8Array) || 'UTF8';
                const unicodeArray = Encoding.convert(uint8Array, { to: 'UNICODE', from: detected });
                let csvText = Encoding.codeToString(unicodeArray);

                let lines = csvText.split(/\r\n|\n|\r/);
                
                // ヘッダー行の特定
                let headerIdx = -1;
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes('H.伝票番号')) {
                        headerIdx = i;
                        break;
                    }
                }

                if (headerIdx === -1) {
                    throw new Error("ヘッダー行が見つかりませんでした。");
                }

                let separator = lines[headerIdx].includes('\t') ? '\t' : ',';
                let headers = parseCSVLine(lines[headerIdx], separator);
                
                const getVal = (rowData, colName) => {
                    let idx = headers.indexOf(colName);
                    return idx !== -1 ? rowData[idx] : undefined;
                };

                let dailyData = {};

                for (let i = headerIdx + 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    let rowData = parseCSVLine(lines[i], separator);
                    
                    let denpyoNo = getVal(rowData, 'H.伝票番号');
                    if (!denpyoNo || String(denpyoNo).trim() === '' || String(denpyoNo) === 'TOTAL') continue;
                    
                    // ★分割会計の重複行（担当者IDが空欄の行）を除外する処理
                    let staffId = getVal(rowData, 'H.レジ担当者ID');
                    if (!staffId || String(staffId).trim() === '') continue; 

                    let dateRaw = String(getVal(rowData, 'H.集計対象営業年月日') || '');
                    let m = dateRaw.match(/(\d{4}\/\d{2}\/\d{2})/);
                    if (!m) continue;
                    let date = m[1];

                    if (!dailyData[date]) {
                        dailyData[date] = {};
                        for (let pk in payProperties) {
                            dailyData[date][pk] = { s10: 0, t10: 0, s8: 0, t8: 0, snon: 0, sun: 0 };
                        }
                    }

                    // 売上合計（税込）
                    let s10 = cleanValue(getVal(rowData, 'H.税抜金額10%')) + cleanValue(getVal(rowData, 'H.税額10%'));
                    let t10 = cleanValue(getVal(rowData, 'H.税額10%'));
                    let s8 = cleanValue(getVal(rowData, 'H.税抜金額8%')) + cleanValue(getVal(rowData, 'H.税額8%'));
                    let t8 = cleanValue(getVal(rowData, 'H.税額8%'));
                    let snon = cleanValue(getVal(rowData, 'H.非課税金額'));
                    let sun = cleanValue(getVal(rowData, 'H.不課税金額'));

                    let totalSales = s10 + s8 + snon + sun;

                    // フォールバック処理
                    let shokei = cleanValue(getVal(rowData, 'H.小計'));
                    let denpyo = cleanValue(getVal(rowData, 'H.伝票金額'));
                    let fallbackSales = Math.max(shokei, denpyo);

                    if (totalSales === 0 && fallbackSales > 0) {
                        s10 = fallbackSales;
                        t10 = Math.round(fallbackSales - (fallbackSales / 1.1));
                        totalSales = fallbackSales;
                    }

                    if (totalSales === 0) continue;

                    // 決済内訳の集計
                    let payAmounts = {};
                    let totalPay = 0;
                    for (let csvCol in csvPayCols) {
                        let pk = csvPayCols[csvCol];
                        let amt = cleanValue(getVal(rowData, csvCol));
                        if (amt !== 0) {
                            payAmounts[pk] = (payAmounts[pk] || 0) + amt;
                            totalPay += amt;
                        }
                    }

                    // 未回収判定
                    if (totalPay === 0 && totalSales > 0) {
                        payAmounts['未回収'] = totalSales;
                        totalPay = totalSales;
                    } else if (totalPay < totalSales) {
                        let uncolAmt = totalSales - totalPay;
                        payAmounts['未回収'] = (payAmounts['未回収'] || 0) + uncolAmt;
                        totalPay = totalSales;
                    }

                    if (totalPay === 0) continue;

                    // 按分処理
                    for (let pk in payAmounts) {
                        let payAmt = payAmounts[pk];
                        let ratio = payAmt / totalPay;
                        
                        let p10 = Math.round(s10 * ratio);
                        let pt10 = Math.round(t10 * ratio);
                        let p8 = Math.round(s8 * ratio);
                        let pt8 = Math.round(t8 * ratio);
                        let pnon = Math.round(snon * ratio);
                        let pun = Math.round(sun * ratio);
                        
                        let diff = payAmt - (p10 + p8 + pnon + pun);
                        if (diff !== 0) {
                            let comps = [
                                { key: '10', val: p10 }, { key: '8', val: p8 },
                                { key: 'non', val: pnon }, { key: 'un', val: pun }
                            ];
                            comps.sort((a, b) => b.val - a.val);
                            let largestKey = comps[0].key;
                            if (largestKey === '10') p10 += diff;
                            else if (largestKey === '8') p8 += diff;
                            else if (largestKey === 'non') pnon += diff;
                            else if (largestKey === 'un') pun += diff;
                        }

                        dailyData[date][pk].s10 += p10;
                        dailyData[date][pk].t10 += pt10;
                        dailyData[date][pk].s8 += p8;
                        dailyData[date][pk].t8 += pt8;
                        dailyData[date][pk].snon += pnon;
                        dailyData[date][pk].sun += pun;
                    }
                }

                // --- Excel出力用のデータ作成 ---
                const workbook = new ExcelJS.Workbook();
                const worksheet = workbook.addWorksheet('データ');

                // 見出し行の設定
                let headerRow = worksheet.addRow(freeeColumns);
                headerRow.height = 25;
                headerRow.eachCell((cell) => {
                    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFDDEBF7' } };
                    cell.font = { name: 'Meiryo', size: 11, bold: true, color: { argb: 'FF000000' } };
                    cell.alignment = { horizontal: 'center', vertical: 'middle' };
                });

                let sortedDates = Object.keys(dailyData).sort();
                if (sortedDates.length === 0) throw new Error("変換可能なデータが見つかりませんでした。");

                for (let date of sortedDates) {
                    let manageNo = date.replace(/\//g, '');

                    for (let pk in payProperties) {
                        let props = payProperties[pk];
                        let vals = dailyData[date][pk];
                        let totalAmt = vals.s10 + vals.s8 + vals.snon + vals.sun;

                        if (totalAmt > 0) {
                            const addEntry = (taxName, amt, tax, baseTag) => {
                                if (amt > 0) {
                                    let entryObj = {};
                                    freeeColumns.forEach(col => entryObj[col] = '');
                                    
                                    // freeeエラー回避のため、すべての行に日付と伝票番号を入れる
                                    entryObj['伝票番号'] = manageNo;
                                    entryObj['日付'] = date;
                                    
                                    // 借方
                                    entryObj['借方勘定科目'] = (props['品目'] === '【成瀬】現金（USENレジ）') ? '現金' : '成瀬売上口座';
                                    entryObj['借方金額'] = amt;
                                    entryObj['借方部門'] = '鰻の成瀬防府店';
                                    entryObj['借方品目'] = props['品目'];
                                    
                                    // 貸方
                                    entryObj['貸方勘定科目'] = 'FCうなぎ売上';
                                    entryObj['貸方金額'] = amt;
                                    entryObj['貸方税区分'] = taxName;
                                    if (tax > 0) entryObj['貸方税額'] = tax;
                                    entryObj['貸方部門'] = '鰻の成瀬防府店';
                                    entryObj['貸方品目'] = props['品目'];
                                    
                                    // 摘要・タグ
                                    if (props['is_uncol']) {
                                        entryObj['摘要'] = `${baseTag} 未収金`;
                                        entryObj['借方メモタグ'] = `${baseTag},未収金`;
                                        entryObj['貸方メモタグ'] = `${baseTag},未収金`;
                                    } else {
                                        entryObj['摘要'] = baseTag;
                                        entryObj['借方メモタグ'] = baseTag;
                                        entryObj['貸方メモタグ'] = baseTag;
                                    }
                                    
                                    // 行の追加と書式設定
                                    let rowArray = freeeColumns.map(col => entryObj[col]);
                                    let row = worksheet.addRow(rowArray);
                                    
                                    row.eachCell((cell, colNumber) => {
                                        cell.font = { name: 'Meiryo', size: 11 };
                                        cell.alignment = { vertical: 'middle' };
                                        // 借方金額(15), 借方税額(17), 貸方金額(29), 貸方税額(31) にカンマ
                                        if ([15, 17, 29, 31].includes(colNumber) && typeof cell.value === 'number') {
                                            cell.numFmt = '#,##0';
                                        }
                                    });
                                }
                            };

                            addEntry('課税売上10%', vals.s10, vals.t10, '店内飲食');
                            addEntry('課税売上8%（軽）', vals.s8, vals.t8, 'テイクアウト');
                            addEntry('非課税売上', vals.snon, 0, 'その他売上（非課税）');
                            addEntry('対象外', vals.sun, 0, 'その他売上（対象外）');
                        }
                    }
                }

                // 列幅の設定
                worksheet.columns.forEach((col, idx) => {
                    let colNum = idx + 1;
                    if ([4, 18].includes(colNum)) col.width = 18; // 勘定科目
                    else if ([9, 10, 11, 23, 24, 25, 32].includes(colNum)) col.width = 25; // 部門,品目,タグ,摘要
                    else if ([16, 30].includes(colNum)) col.width = 18; // 税区分
                    else col.width = 12;
                });

                worksheet.views = [{ state: 'frozen', xSplit: 1, ySplit: 1 }];

                // ダウンロード
                const buffer = await workbook.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = file.name.replace(/\.[^/.]+$/, "") + '_freee振替伝票.xlsx';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

            } catch (error) {
                console.error("エラー:", error);
                alert(`${file.name} の処理中にエラーが発生しました。\n${error.message}`);
            }
        }

        selectedFiles = [];
        updateFileList();
        statusMsg.innerText = "変換が完了しました！";
        statusMsg.style.color = "#4CAF50";
        setTimeout(() => { if(statusMsg.innerText === "変換が完了しました！") statusMsg.innerText = ""; }, 5000);
        executeBtn.disabled = false;
    });
</script>
</body>
</html>
